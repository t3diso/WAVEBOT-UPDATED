<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAVEBOT · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --bg-2: #0f131c;
    --panel: #151a26;
    --panel-2: #1b2130;
    --border: #262d40;
    --texto: #e8eaf2;
    --texto-2: #97a0b3;
    --acento: #8b7cf6;
    --acento-suave: rgba(139, 124, 246, .14);
    --verde: #23a55a;
    --rojo: #f23f43;
    --naranja: #f0b232;
    --radio: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--texto);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--acento); text-decoration: none; }

  /* ===== Barra superior ===== */
  #topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px; background: var(--bg-2);
    border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
  }
  .bot-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--panel-2); }
  .bot-nombre { font-size: 16.5px; font-weight: 700; }
  .bot-sub { color: var(--texto-2); font-size: 11.5px; margin-top: 1px; }
  .estado-punto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--verde); margin-right: 5px; vertical-align: 1px; }
  .estado-punto.off { background: var(--rojo); }
  .chips-top { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  .stat-chip { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 5px 13px; text-align: center; }
  .stat-chip b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
  .stat-chip span { font-size: 10.5px; color: var(--texto-2); text-transform: uppercase; letter-spacing: .5px; }
  .btn-refrescar { background: var(--acento); color: #fff; border: 0; border-radius: 10px; padding: 8px 15px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-refrescar:hover { filter: brightness(1.12); }

  /* ===== Layout ===== */
  .layout { flex: 1; display: flex; min-height: 0; }

  /* Columna servidores */
  .lista-servidores {
    width: 262px; min-width: 262px; background: var(--bg-2);
    border-right: 1px solid var(--border); padding: 14px 12px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  }
  .titulo-columna { font-size: 10.5px; font-weight: 700; color: var(--texto-2); text-transform: uppercase; letter-spacing: .6px; padding: 0 6px; }
  #buscar-guild { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--texto); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  #buscar-guild:focus { outline: 1px solid var(--acento); }
  .lista-guilds { display: flex; flex-direction: column; gap: 6px; }
  .guild-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: 1px solid transparent; border-radius: 11px;
    padding: 8px 10px; cursor: pointer; color: var(--texto); text-align: left; font-size: 13.5px;
    transition: background .12s, border-color .12s;
  }
  .guild-btn:hover { background: var(--panel); }
  .guild-btn.activo { background: var(--acento-suave); border-color: var(--acento); }
  .guild-icono { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--texto-2); overflow: hidden; }
  .guild-icono img { width: 100%; height: 100%; object-fit: cover; }
  .guild-info { overflow: hidden; }
  .guild-nombre { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guild-miembros { font-size: 11px; color: var(--texto-2); }

  /* Zona del guild */
  .zona-guild { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }

  .guild-top {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg-2);
    position: sticky; top: 0; z-index: 5;
  }
  .guild-top img.gicono { width: 52px; height: 52px; border-radius: 14px; background: var(--panel-2); }
  .guild-top .giniciales { width: 52px; height: 52px; border-radius: 14px; background: var(--acento); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; }
  .guild-top h1 { font-size: 18px; }
  .guild-meta { color: var(--texto-2); font-size: 12.5px; margin-top: 2px; }
  .guild-tags { margin-left: auto; display: flex; gap: 7px; flex-wrap: wrap; }
  .etiqueta { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; font-size: 11.5px; color: var(--texto-2); }
  .etiqueta b { color: var(--texto); }
  .btn-movil { display: none; background: var(--panel); border: 1px solid var(--border); color: var(--texto); border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; }

  .guild-cuerpo { display: flex; min-height: 0; flex: 1; }

  /* Navegación de secciones */
  .nav-secciones {
    width: 218px; min-width: 218px; padding: 16px 10px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 3px; overflow-y: auto;
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: 0; border-radius: 10px; padding: 9px 12px;
    color: var(--texto-2); font-size: 13.5px; font-weight: 600; cursor: pointer; text-align: left;
    transition: background .12s, color .12s;
  }
  .nav-btn:hover { background: var(--panel); color: var(--texto); }
  .nav-btn.activo { background: var(--acento-suave); color: var(--acento); }
  .nav-btn .candado { margin-left: auto; font-size: 11px; opacity: .7; }
  .nav-separador { height: 1px; background: var(--border); margin: 10px 6px; }

  /* Contenido */
  .contenido { flex: 1; padding: 22px 26px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radio); padding: 20px 22px; margin-bottom: 18px; }
  .card h2 { font-size: 15.5px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .sub { color: var(--texto-2); font-weight: 400; font-size: 12px; }

  /* Tiles de resumen */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .num { font-size: 21px; font-weight: 800; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .tile .lbl { font-size: 11px; color: var(--texto-2); text-transform: uppercase; letter-spacing: .5px; }
  .modulos { display: flex; flex-wrap: wrap; gap: 10px; }
  .modulo-pill {
    display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 16px; cursor: pointer; font-size: 13.5px; font-weight: 600;
    transition: border-color .12s;
  }
  .modulo-pill:hover { border-color: var(--acento); }
  .modulo-pill .estado { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .estado.on { background: rgba(35, 165, 90, .15); color: var(--verde); }
  .estado.off { background: rgba(242, 63, 67, .12); color: var(--rojo); }

  /* Formularios */
  .fila-opcion { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .fila-opcion:last-of-type { border-bottom: 0; }
  .opcion-label { font-size: 13.5px; }
  .opcion-desc { font-size: 11.5px; color: var(--texto-2); margin-top: 2px; max-width: 340px; }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .pista { position: absolute; inset: 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; transition: .2s; }
  .switch .pista::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--texto-2); top: 3px; left: 3px; transition: .2s; }
  .switch input:checked + .pista { background: var(--verde); border-color: var(--verde); }
  .switch input:checked + .pista::after { left: 23px; background: #fff; }
  input[type=number], input[type=text], select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--texto);
    border-radius: 9px; padding: 8px 10px; font-size: 13.5px; width: 110px;
  }
  select { width: 170px; cursor: pointer; }
  input:focus, select:focus { outline: 1px solid var(--acento); }
  input.mini-input { width: 78px !important; }
  .acciones-form { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 10px; padding: 10px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: #fff; }
  .btn-primario { background: var(--acento); }
  .btn-primario:hover { filter: brightness(1.12); }
  .btn-peligro { background: var(--rojo); }
  .btn-peligro:hover { filter: brightness(1.12); }
  .btn-verde { background: var(--verde); }
  .btn-verde:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .banner-raid { display: none; margin-bottom: 14px; padding: 11px 14px; border-radius: 10px; background: rgba(240, 178, 50, .1); border: 1px solid var(--naranja); color: var(--naranja); font-size: 13px; font-weight: 600; }
  .banner-raid.visible { display: block; }
  .banner-ro { background: var(--panel-2); border-color: var(--border); color: var(--texto-2); }

  .grupo-titulo { font-size: 11.5px; font-weight: 700; color: var(--texto-2); text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 7px 5px 12px; font-size: 12.5px; }
  .chip.fijo { padding-right: 12px; color: var(--texto-2); }
  .chip button { background: none; border: 0; color: var(--texto-2); cursor: pointer; font-size: 14px; padding: 0 6px; line-height: 1; }
  .chip button:hover { color: var(--rojo); }
  .fila-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fila-inline select { flex: 1; min-width: 150px; width: auto; }

  .dato-fila { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; gap: 10px; }
  .dato-fila:last-child { border-bottom: 0; }
  .dato-fila span { color: var(--texto-2); }
  .dato-fila b { text-align: right; max-width: 60%; overflow-wrap: anywhere; }
  .verde { color: var(--verde); } .rojo { color: var(--rojo); }

  .item-tienda { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .item-tienda:last-child { border-bottom: 0; }
  .item-tienda .nombre { font-weight: 600; min-width: 90px; }
  .item-tienda .precio { color: var(--verde); font-weight: 700; min-width: 80px; }
  .item-tienda .desc { color: var(--texto-2); flex: 1; overflow-wrap: anywhere; }

  .stats-mini { display: flex; gap: 10px; margin: 12px 0 4px; flex-wrap: wrap; }
  .mini-chip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 7px 13px; font-size: 12.5px; color: var(--texto-2); }
  .mini-chip b { color: var(--texto); font-size: 14px; margin-right: 4px; }

  .vacio { color: var(--texto-2); font-size: 13.5px; text-align: center; padding: 26px 10px; }
  .cargando { display: flex; align-items: center; gap: 10px; color: var(--texto-2); font-size: 14px; padding: 40px; justify-content: center; }
  .spinner { width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--acento); border-radius: 50%; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ===== Toast ===== */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel-2); border: 1px solid var(--border); color: var(--texto); padding: 12px 22px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: .25s; z-index: 100; max-width: 90vw; }
  #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: var(--verde); } #toast.err { border-color: var(--rojo); }

  /* ===== Login ===== */
  #overlay-login { position: fixed; inset: 0; background: rgba(5, 7, 12, .82); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 26px 28px; width: min(400px, 92vw); text-align: center; }
  .login-card h2 { margin-bottom: 8px; }
  .login-desc { color: var(--texto-2); font-size: 13px; margin-bottom: 16px; }
  .login-debug { color: var(--naranja); font-size: 12px; margin-top: 12px; overflow-wrap: anywhere; }
  #login-input { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--texto); border-radius: 10px; padding: 11px 13px; font-size: 13.5px; margin-bottom: 12px; }
  #login-input:focus { outline: 1px solid var(--acento); }

  /* ===== Responsive ===== */
  @media (max-width: 1150px) { .nav-secciones { width: 64px; min-width: 64px; } .nav-btn { justify-content: center; padding: 10px 0; } .nav-btn .texto-nav, .nav-btn .candado { display: none; } }
  @media (max-width: 860px) {
    .lista-servidores { display: none; position: fixed; inset: 58px 0 0 0; z-index: 50; width: auto; }
    .lista-servidores.abierto { display: flex; }
    .btn-movil { display: inline-block; }
    .chips-top .stat-chip { display: none; }
    .guild-cuerpo { flex-direction: column; }
    .nav-secciones { width: 100%; min-width: 0; flex-direction: row; overflow-x: auto; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--border); }
    .nav-btn { flex-shrink: 0; }
    .nav-btn .texto-nav { display: inline; }
    .nav-separador { display: none; }
    .contenido { padding: 16px; }
  }
</style>
</head>
<body>

<header id="topbar">
  <img id="bot-avatar" class="bot-avatar" alt="">
  <div>
    <div class="bot-nombre"><span id="bot-estado" class="estado-punto"></span><span id="bot-nombre">Cargando…</span></div>
    <div class="bot-sub" id="bot-sub">Conectando con el bot…</div>
  </div>
  <div id="user-box" style="margin-left:6px"></div>
  <div class="chips-top">
    <div class="stat-chip"><b id="h-servidores">–</b><span>Servidores</span></div>
    <div class="stat-chip"><b id="h-usuarios">–</b><span>Usuarios</span></div>
    <div class="stat-chip"><b id="h-ping">–</b><span>Ping</span></div>
    <div class="stat-chip"><b id="h-uptime">–</b><span>Uptime</span></div>
    <div class="stat-chip" id="chip-owner" style="display:none"><b id="h-owner">–</b><span>Owner</span></div>
    <button class="btn-refrescar" onclick="refrescarTodo()">↻ Refrescar</button>
  </div>
</header>

<div class="layout">
  <aside class="lista-servidores" id="col-servidores">
    <div class="titulo-columna">Tus servidores</div>
    <input id="buscar-guild" type="text" placeholder="🔎 Buscar servidor…" oninput="pintarGuilds()">
    <div class="lista-guilds" id="lista-guilds">
      <div class="cargando"><div class="spinner"></div> Cargando servidores…</div>
    </div>
  </aside>

  <div class="zona-guild" id="zona-guild">
    <div class="cargando"><div class="spinner"></div> Cargando datos del bot…</div>
  </div>
</div>

<div id="toast"></div>

<script>
const TOKEN_URL = new URLSearchParams(location.search).get("token") || "";
let TOKEN = TOKEN_URL || sessionStorage.getItem("dash_token") || "";
let GUILDS = [];
let GUILD_ACTUAL = null;
let DATOS_GUILD = null;
let ESTADO = null;
let SECCION_ACTUAL = localStorage.getItem("dash_seccion") || "resumen";
let REFRESCO_AUTO = null;

/* ===== Base ===== */
function api(ruta, opciones = {}) {
  const url = new URL(ruta, location.origin);
  if (TOKEN) url.searchParams.set("token", TOKEN);
  const cfg = { ...opciones, headers: { "Content-Type": "application/json" } };
  return fetch(url, cfg).then(async r => {
    if (r.status === 401) {
      const datos = await r.json().catch(() => ({}));
      mostrarLogin(datos);
      throw new Error("Token requerido");
    }
    const datos = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(datos.error || "Error " + r.status);
    return datos;
  });
}

function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function toast(msg, ok = true) {
  if (document.getElementById("overlay-login")) return;
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "visible " + (ok ? "ok" : "err");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = "", 3200);
}

function fmtNum(n) { return Number(n || 0).toLocaleString("es-ES"); }

function fmtUptime(seg) {
  seg = Math.floor(seg || 0);
  const d = Math.floor(seg / 86400), h = Math.floor(seg % 86400 / 3600), m = Math.floor(seg % 3600 / 60);
  if (d > 0) return d + "d " + h + "h";
  if (h > 0) return h + "h " + m + "m";
  return m + "m " + (seg % 60) + "s";
}

/* ===== Login ===== */
function mostrarLogin(datos) {
  if (document.getElementById("overlay-login")) return;
  const div = document.createElement("div");
  div.id = "overlay-login";
  const debug = datos && datos.debug
    ? `<div class="login-debug">Diagnóstico: recibido ${esc(datos.debug.token_recibido)} · esperado ${esc(datos.debug.token_esperado)}</div>`
    : "";
  div.innerHTML = `
    <div class="login-card">
      <h2>🔐 Acceder al dashboard</h2>
      <div class="login-desc">Entra con tu cuenta de Discord y verás tus servidores según tus permisos: los mods pueden configurar, el resto solo ve.</div>
      <a class="btn btn-primario" style="display:block;text-decoration:none" href="/oauth/login">🔐 Entrar con Discord</a>
      <div style="text-align:right;margin-top:16px">
        <a href="#" onclick="mostrarTokenLogin(event)" style="font-size:11.5px;color:var(--texto-2)">Acceso con token maestro</a>
      </div>
      <div id="token-box" style="display:none;margin-top:12px">
        <input id="login-input" type="password" placeholder="Token maestro" autocomplete="off">
        <button class="btn btn-primario" style="width:100%" onclick="entrarConToken()">Entrar con token</button>
      </div>
      ${debug}
    </div>`;
  document.body.appendChild(div);
  const input = document.getElementById("login-input");
  input.addEventListener("keydown", e => { if (e.key === "Enter") entrarConToken(); });
}

function mostrarTokenLogin(ev) {
  if (ev) ev.preventDefault();
  const caja = document.getElementById("token-box");
  if (!caja) return;
  caja.style.display = caja.style.display === "none" ? "" : "none";
  if (caja.style.display === "none") return;
  const input = document.getElementById("login-input");
  if (input) input.focus();
}

function entrarConToken() {
  const valor = document.getElementById("login-input").value.trim();
  if (!valor) return;
  TOKEN = valor;
  try { sessionStorage.setItem("dash_token", TOKEN); } catch (e) {}
  const overlay = document.getElementById("overlay-login");
  if (overlay) overlay.remove();
  refrescarTodo();
}

/* ===== Estado del bot (topbar) ===== */
async function cargarEstado() {
  try {
    const s = await api("/api/status");
    ESTADO = s;
    document.getElementById("bot-nombre").textContent = s.bot.nombre || "WAVEBOT";
    document.getElementById("bot-sub").textContent = "ID " + (s.bot.id || "–") + " · " + (s.estado === "online" ? "En línea" : "Sin conexión");
    document.getElementById("bot-estado").className = "estado-punto" + (s.estado === "online" ? "" : " off");
    document.getElementById("h-servidores").textContent = fmtNum(s.servidores);
    document.getElementById("h-usuarios").textContent = fmtNum(s.usuarios);
    document.getElementById("h-ping").textContent = s.ping_ms != null ? s.ping_ms + " ms" : "–";
    document.getElementById("h-uptime").textContent = fmtUptime(s.uptime_seg);
    const chipOwner = document.getElementById("chip-owner");
    if (s.owner) {
      document.getElementById("h-owner").textContent = s.owner.nombre;
      chipOwner.style.display = "";
    } else {
      chipOwner.style.display = "none";
    }
    const ub = document.getElementById("user-box");
    if (s.usuario) {
      ub.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:4px 8px 4px 5px">
          ${s.usuario.avatar ? `<img src="${esc(s.usuario.avatar)}" style="width:26px;height:26px;border-radius:50%" alt="">` : ""}
          <span style="font-size:13px;font-weight:600">${esc(s.usuario.nombre)}${s.usuario.es_bot_owner ? " 👑" : ""}</span>
          <a href="/oauth/logout" style="color:var(--texto-2);font-size:11.5px;padding:0 6px">Salir</a>
        </div>`;
    } else {
      ub.innerHTML = '<a class="btn btn-primario" style="text-decoration:none;display:inline-block;padding:8px 14px;font-size:12.5px" href="/oauth/login">🔐 Entrar con Discord</a>';
    }
    const av = document.getElementById("bot-avatar");
    if (s.bot.avatar) { av.src = s.bot.avatar; av.style.display = ""; } else { av.style.display = "none"; }
  } catch (e) {
    if (e.message !== "Token requerido") toast("Error cargando estado: " + e.message, false);
  }
}

/* ===== Lista de servidores ===== */
async function cargarGuilds() {
  try {
    GUILDS = await api("/api/guilds");
    pintarGuilds();
    if (!GUILD_ACTUAL && GUILDS.length) seleccionarGuild(GUILDS[0].id);
    if (!GUILDS.length && !GUILD_ACTUAL) {
      document.getElementById("zona-guild").innerHTML =
        '<div class="card"><div class="vacio">No hay servidores en común: el bot no está en ningún servidor donde tú estés (o no iniciaste sesión).</div></div>';
    }
  } catch (e) {
    if (e.message !== "Token requerido") {
      document.getElementById("lista-guilds").innerHTML = "";
      toast("Error cargando servidores: " + e.message, false);
    }
  }
}

function pintarGuilds() {
  const filtro = document.getElementById("buscar-guild").value.toLowerCase();
  const cont = document.getElementById("lista-guilds");
  cont.innerHTML = GUILDS
    .filter(g => g.nombre.toLowerCase().includes(filtro))
    .map(g => `
      <button class="guild-btn ${g.id === GUILD_ACTUAL ? "activo" : ""}" onclick="seleccionarGuild('${g.id}')">
        ${g.icono
          ? `<div class="guild-icono"><img src="${esc(g.icono)}" alt=""></div>`
          : `<div class="guild-icono">${esc(g.nombre.slice(0, 2).toUpperCase())}</div>`}
        <div class="guild-info">
          <div class="guild-nombre">${esc(g.nombre)}</div>
          <div class="guild-miembros">👥 ${fmtNum(g.miembros)}</div>
        </div>
      </button>`).join("");
}

/* ===== Selección y estructura del guild ===== */
async function seleccionarGuild(id) {
  GUILD_ACTUAL = id;
  pintarGuilds();
  document.getElementById("col-servidores").classList.remove("abierto");
  const zona = document.getElementById("zona-guild");
  zona.innerHTML = '<div class="cargando"><div class="spinner"></div> Cargando servidor…</div>';
  try {
    DATOS_GUILD = await api("/api/guild/" + id);
    pintarGuild();
  } catch (e) {
    zona.innerHTML = '<div class="card"><div class="vacio">❌ ' + esc(e.message) + "</div></div>";
  }
}

const NAV_SECCIONES = [
  ["resumen", "🏠", "Resumen"],
  ["antiraid", "🚨", "Antiraid"],
  ["honeypots", "🍯", "Honeypots"],
  ["canales", "🔗", "Canales y links"],

  ["warns", "⚠️", "Warns"],
  ["starboard", "⭐", "Starboard"],

  ["tienda", "🛍️", "Tienda"],

function nivelTextoDe(nivel) {
  return {
    bot_owner: "👑 Owner del bot",
    owner: "🛡️ Owner del servidor",
    mod: "⚔️ Moderador",
    member: "👁️ Solo lectura",
  }[nivel] || "👁️ Solo lectura";
}

function pintarGuild() {
  const g = DATOS_GUILD;
  const perms = g.permisos || {};
  const candado = seccion => {
    if (seccion === "roles") return (!perms.manage_roles && !perms.manage_guild) ? "🔒" : "";
    if (seccion === "warns") return perms.moderate_members ? "" : "🔒";
    return perms.manage_guild ? "" : "🔒";
  };
  const navOwner = g.es_bot_owner
    ? `<div class="nav-separador"></div>
       <button class="nav-btn ${SECCION_ACTUAL === "owner" ? "activo" : ""}" onclick="mostrarSeccion('owner')"><span>👑</span><span class="texto-nav">Owner del bot</span></button>`
    : "";

  document.getElementById("zona-guild").innerHTML = `
    <div class="guild-top">
      <button class="btn-movil" onclick="document.getElementById('col-servidores').classList.toggle('abierto')">☰ Servidores</button>
      ${g.icono
        ? `<img class="gicono" src="${esc(g.icono)}" alt="">`
        : `<div class="giniciales">${esc(g.nombre.slice(0, 2).toUpperCase())}</div>`}
      <div>
        <h1>${esc(g.nombre)}</h1>
        <div class="guild-meta">👑 ${esc(g.owner_nombre || "Desconocido")} · 🗓️ ${esc(g.creado_texto)} · ⌨️ ${esc(g.prefijos.join(" · "))}</div>
      </div>
      <div class="guild-tags">
        <span class="etiqueta">${nivelTextoDe(g.nivel)}</span>
        <span class="etiqueta">👥 <b>${fmtNum(g.miembros)}</b></span>
        <span class="etiqueta">🤖 <b>${fmtNum(g.bots)}</b></span>
      </div>
    </div>
    <div class="guild-cuerpo">
      <nav class="nav-secciones">
        ${NAV_SECCIONES.map(([id, icono, texto]) => `
          <button class="nav-btn ${SECCION_ACTUAL === id ? "activo" : ""}" onclick="mostrarSeccion('${id}')">
            <span>${icono}</span><span class="texto-nav">${texto}</span>${candado(id) ? `<span class="candado">${candado(id)}</span>` : ""}
          </button>`).join("")}
        ${navOwner}
      </nav>
      <main class="contenido" id="contenido-seccion"></main>
    </div>`;
  mostrarSeccion(SECCION_ACTUAL);
}

function mostrarSeccion(seccion) {
  const g = DATOS_GUILD;
  if (!g) return;
  if (seccion === "owner" && !g.es_bot_owner) seccion = "resumen";
  if (!NAV_SECCIONES.some(s => s[0] === seccion) && seccion !== "owner") seccion = "resumen";
  SECCION_ACTUAL = seccion;
  try { localStorage.setItem("dash_seccion", seccion); } catch (e) {}
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("activo"));
  const btns = document.querySelectorAll(".nav-secciones .nav-btn");
  const idx = NAV_SECCIONES.map(s => s[0]).indexOf(seccion);
  if (idx >= 0 && btns[idx]) btns[idx].classList.add("activo");
  else if (seccion === "owner" && btns[btns.length - 1]) btns[btns.length - 1].classList.add("activo");

  const cont = document.getElementById("contenido-seccion");
  if (!cont) return;
  const render = SECCIONES[seccion] || SECCIONES.resumen;
  cont.innerHTML = render();
  aplicarPermisosSeccion(seccion);
}

/* ===== Helpers de render ===== */
function optsCanales(sel, conVacio) {
  const g = DATOS_GUILD;
  return (conVacio ? `<option value="" ${!sel ? "selected" : ""}>— Sin canal —</option>` : "") +
    (g.canales || []).map(c => `<option value="${c.id}" ${sel === c.id ? "selected" : ""}>#${esc(c.nombre)}</option>`).join("");
}

function optsRoles(sel) {
  const g = DATOS_GUILD;
  return (g.roles || []).map(r => `<option value="${r.id}" ${sel === r.id ? "selected" : ""}>@${esc(r.nombre)}</option>`).join("");
}

function notaRO(perm, nombrePerm) {
  return perm ? "" : `
    <div class="banner-raid visible banner-ro">
      👁️ Solo lectura — necesitas el permiso ${nombrePerm || "Manage Server"} en este servidor.
    </div>`;
}

function pct(v) { return Math.round((v || 0) * 100); }

function desactivar(ids) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.querySelectorAll("input, select, button").forEach(x => { x.disabled = true; });
  });
}

function aplicarPermisosSeccion(seccion) {
  const perms = (DATOS_GUILD || {}).permisos || {};
  if (seccion === "roles") {
    if (!perms.manage_roles) desactivar(["sec-autoroles"]);
    if (!perms.manage_guild) desactivar(["sec-prefijos"]);
    return;
  }
  if (seccion === "warns") {
    if (!perms.moderate_members) desactivar(["card-warns"]);
    return;
  }
  if (seccion === "owner") return;
  if (!perms.manage_guild) desactivar(["contenido-seccion"]);
}

/* ===== Acciones ===== */
async function guardarAntiraid() {
  const payload = {
    enabled: document.getElementById("ar-enabled").checked,
    threshold: parseInt(document.getElementById("ar-threshold").value, 10),
    seconds: parseInt(document.getElementById("ar-seconds").value, 10),
    action: document.getElementById("ar-action").value,
    punish_new: document.getElementById("ar-punishnew").checked,
    min_age: parseInt(document.getElementById("ar-minage").value, 10),
  };
  try {
    await api("/api/guild/" + GUILD_ACTUAL + "/antiraid", { method: "POST", body: JSON.stringify(payload) });
    toast("✅ Antiraid guardado correctamente");
    await seleccionarGuild(GUILD_ACTUAL);
  } catch (e) { toast("❌ " + e.message, false); }
}

async function toggleRaidmode(estado) {
  if (estado === "on" && !confirm("¿Activar el modo raid manual?\n\nTODOS los que entren al servidor serán castigados hasta que lo apagues. El staff (Manage Server) queda exento.")) return;
  try {
    await api("/api/guild/" + GUILD_ACTUAL + "/raidmode", { method: "POST", body: JSON.stringify({ estado }) });
    toast(estado === "on" ? "🚨 Modo raid ACTIVADO" : "✅ Modo raid desactivado");
    await seleccionarGuild(GUILD_ACTUAL);
  } catch (e) { toast("❌ " + e.message, false); }
}

async function guardarEconomia() {
  const ent = id => parseInt(document.getElementById(id).value, 10) || 0;
  const pctv = id => (parseFloat(document.getElementById(id).value) || 0) / 100;
  const payload = {
    currency: document.getElementById("ec-currency").value.trim(),
    start_balance: ent("ec-start"),
    daily_min: ent("ec-daily-min"), daily_max: ent("ec-daily-max"),
    weekly_min: ent("ec-weekly-min"), weekly_max: ent("ec-weekly-max"),
    monthly_min: ent("ec-monthly-min"), monthly_max: ent("ec-monthly-max"),
    work_min: ent("ec-work-min"), work_max: ent("ec-work-max"),
    crime_min: ent("ec-crime-min"), crime_max: ent("ec-crime-max"), crime_fallo: pctv("ec-crime-fallo"),
    slut_min: ent("ec-slut-min"), slut_max: ent("ec-slut-max"), slut_fallo: pctv("ec-slut-fallo"),
    rob_min: pctv("ec-rob-min"), rob_max: pctv("ec-rob-max"), rob_fallo: pctv("ec-rob-fallo"),
  };
  try {
    await api("/api/guild/" + GUILD_ACTUAL + "/economy", { method: "POST", body: JSON.stringify(payload) });
    toast("✅ Economía guardada correctamente");
    await seleccionarGuild(GUILD_ACTUAL);
  } catch (e) { toast("❌ " + e.message, false); }
}

async function dineroUsuario() {
  const payload = {
    user_id: document.getElementById("eu-id").value.trim(),
    accion: document.getElementById("eu-accion").value,
    cantidad: parseInt(document.getElementById("eu-cantidad").value, 10) || 0,
  };
  try {
    const r = await api("/api/guild/" + GUILD_ACTUAL + "/economy/user", { method: "POST", body: JSON.stringify(payload) });
    toast("✅ Hecho. Efectivo: " + fmtNum(r.cash) + " · Banco: " + fmtNum(r.bank));
  } catch (e) { toast("❌ " + e.message, false); }
}

async function tiendaAdd() {
  const payload = {
    accion: "add",

    precio: parseInt(document.getElementById("shop-precio").value, 10) || 0,

  };

    const r = await api("/api/guild/" + GUILD_ACTUAL + "/shop", { method: "POST", body: JSON.stringify(payload) });

}

  try {
    const r = await api("/api/guild/" + GUILD_ACTUAL + "/prefix", { method: "POST", body: JSON.stringify({ prefijo: p, accion: "add" }) });

    const r = await api("/api/guild/" + GUILD_ACTUAL + "/prefix", { method: "POST", body: JSON.stringify({ prefijo: p, accion: "remove" }) });

async function buscarWarns() {
  const uid = document.getElementById("warns-uid").value.trim();
  if (!uid) return toast("Escribe la ID del usuario", false);
  try {
    const r = await api("/api/guild/" + GUILD_ACTUAL + "/warns?user_id=" + encodeURIComponent(uid));
    const cont = document.getElementById("warns-resultado");
    if (!r.warns.length) {
      cont.innerHTML = '<div style="color:var(--texto-2);font-size:13px;padding:8px 0">Ese usuario no tiene warns. ✨</div>';
      return;
    }
    cont.innerHTML = r.warns.map(w => `
      <div class="dato-fila">
        <span>#${w.numero} · ${esc(w.motivo)}</span>
        <b>${esc(w.moderador)} <button class="btn btn-peligro" style="padding:4px 10px;font-size:11.5px" onclick="warnRemove('${esc(uid)}', ${w.numero})" title="Eliminar warn">🗑</button></b>
      </div>`).join("");
  } catch (e) { toast("❌ " + e.message, false); }
}

async function warnRemove(uid, numero) {
  try {
    const r = await api("/api/guild/" + GUILD_ACTUAL + "/warns/remove", { method: "POST", body: JSON.stringify({ user_id: uid, numero }) });
    toast(r.msg, r.ok);
    document.getElementById("warns-uid").value = uid;
    buscarWarns();
  } catch (e) { toast("❌ " + e.message, false); }
}

/* ===== Acciones de owner ===== */
async function expulsarBot() {
  const g = DATOS_GUILD;
  if (!confirm('¿EXPULSAR al bot de "' + (g ? g.nombre : "este servidor") + '"?\n\nEl bot saldrá del servidor y dejará de funcionar ahí (antiraid, warns, economía...). Esta acción no se puede deshacer.')) return;
  try {
    const r = await api("/api/guild/" + GUILD_ACTUAL + "/leave", { method: "POST", body: JSON.stringify({}) });
    toast("🚪 Bot expulsado de " + r.salido);
    GUILD_ACTUAL = null;
    DATOS_GUILD = null;
    await cargarGuilds();
  } catch (e) { toast("❌ " + e.message, false); }
}

async function sincronizarSlash() {
  try {
    const r = await api("/api/sync", { method: "POST", body: JSON.stringify({}) });
    toast("🔄 Slash commands sincronizados: " + fmtNum(r.sincronizados));
  } catch (e) { toast("❌ " + e.message, false); }
}

function refrescarTodo() {
  cargarEstado();
  cargarGuilds();
  if (GUILD_ACTUAL) seleccionarGuild(GUILD_ACTUAL);
}

cargarEstado();
cargarGuilds();
